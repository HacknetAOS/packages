name: Build Packages

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  repository_dispatch:
    types: [source-updated]
  workflow_dispatch:

jobs:
  build:
    name: Build Arch Packages
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git rust cargo sudo gnupg
          useradd -m -s /bin/bash builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - uses: actions/checkout@v4

      - name: Clone sibling repositories
        run: |
          mkdir -p /home/builder/src
          cd /home/builder/src
          git clone --filter=blob:none https://github.com/HacknetAOS/hacknet-core.git
          git clone --filter=blob:none https://github.com/HacknetAOS/hacknet-shell.git
          git clone --filter=blob:none https://github.com/HacknetAOS/hacknet-theme.git
          chown -R builder:builder /home/builder/src

      - name: Auto-bump pkgrel from source commit counts
        run: |
          core_commits=$(git -c safe.directory='*' -C /home/builder/src/hacknet-core rev-list --count HEAD)
          shell_commits=$(git -c safe.directory='*' -C /home/builder/src/hacknet-shell rev-list --count HEAD)
          theme_commits=$(git -c safe.directory='*' -C /home/builder/src/hacknet-theme rev-list --count HEAD)

          bump_pkg() {
            local pkg="$1" computed="$2" p="$1/PKGBUILD" cur new_rel
            cur=$(sed -n 's/^pkgrel=\([0-9][0-9]*\).*/\1/p' "$p" | head -n1)
            cur="${cur:-1}"
            new_rel=$(( cur > computed ? cur : computed ))
            if [ "$new_rel" != "$cur" ]; then
              sed -i "s/^pkgrel=.*/pkgrel=${new_rel}/" "$p"
            fi
            echo "${pkg}: pkgrel=${new_rel}"
          }

          bump_pkg hacknet-shell "$((61 + shell_commits))"
          bump_pkg hacknetd      "$((15 + core_commits))"
          bump_pkg hacknetctl    "$((8 + core_commits))"
          bump_pkg hacknet-proto "$((8 + core_commits))"
          bump_pkg hacknet-theme "$((7 + theme_commits))"

      - name: Import GPG signing key (if configured)
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -n "${GPG_PRIVATE_KEY}" ]; then
            su builder -c "gpg --batch --import" <<< "${GPG_PRIVATE_KEY}"
          else
            echo "GPG_PRIVATE_KEY not set; packages will be built unsigned."
          fi

      - name: Build packages
        run: |
          chown -R builder:builder .
          su builder -c "HACKNET_SRC=/home/builder/src PKG_DIR=\"$PWD/pkg-out\" ./build-packages.sh"

      - name: Verify repository database
        run: |
          ls -la pkg-out/
          test -f pkg-out/hacknetos.db.tar.gz
          test -f pkg-out/hacknetos.db

      - name: Upload built packages
        uses: actions/upload-artifact@v4
        with:
          name: hacknetos-packages
          path: pkg-out/*

      - name: Publish updated packages to HacknetAOS/repo
        if: github.event_name != 'pull_request'
        env:
          REPO_PUSH_TOKEN: ${{ secrets.REPO_PUSH_TOKEN }}
        run: |
          if [ -z "${REPO_PUSH_TOKEN}" ]; then
            echo "REPO_PUSH_TOKEN not configured; skipping push to HacknetAOS/repo."
            exit 0
          fi
          git clone "https://x-access-token:${REPO_PUSH_TOKEN}@github.com/HacknetAOS/repo.git" /tmp/hacknet-repo
          rm -f /tmp/hacknet-repo/x86_64/*.pkg.tar.zst /tmp/hacknet-repo/x86_64/*.pkg.tar.zst.sig
          rm -f /tmp/hacknet-repo/x86_64/hacknetos.db* /tmp/hacknet-repo/x86_64/hacknetos.files*
          cp -f pkg-out/*.pkg.tar.zst /tmp/hacknet-repo/x86_64/
          cp -f pkg-out/*.pkg.tar.zst.sig /tmp/hacknet-repo/x86_64/ 2>/dev/null || true
          cp -f pkg-out/hacknetos.db* pkg-out/hacknetos.files* /tmp/hacknet-repo/x86_64/
          cd /tmp/hacknet-repo
          git config user.name "HacknetAOS CI"
          git config user.email "hacknetaos@users.noreply.github.com"
          git add -A x86_64/
          if git diff --cached --quiet; then
            echo "HacknetAOS/repo is already up to date."
          else
            git commit -m "Auto-update packages from ${GITHUB_EVENT_NAME} (${GITHUB_SHA::7})"
            git push origin main
          fi
